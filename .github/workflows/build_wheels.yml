name: Build Wheels

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build_wheels_linux:
    name: Build wheels on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ">=3.12"

      - name: Install cibuildwheel
        run: pip install cibuildwheel==3.1.4

      - name: Build wheels
        env:
          CIBW_BUILD: "cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64 cp314t-manylinux_x86_64"
          CIBW_ENABLE: cpython-prerelease cpython-freethreading
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BUILD_VERBOSITY: "3"
          CIBW_BEFORE_ALL: |
            yum update -y
            yum install -y cmake gcc gcc-c++ make git pkgconfig
          CIBW_ENVIRONMENT: >
            LDFLAGS="-fopenmp"
          CIBW_REPAIR_WHEEL_COMMAND: |
            auditwheel repair -w {dest_dir} --plat manylinux_2_28_x86_64 {wheel}
          CIBW_TEST_COMMAND: |
            pip install numpy
            pip install --no-deps {wheel}
            pip install pytest pytest-run-parallel
            if python -c "import sys; exit(0 if hasattr(sys, '_is_gil_enabled') and not sys._is_gil_enabled() else 1)"; then
              pytest --parallel-threads=10 --iterations=10 {project}/tests
            else
              pytest -s {project}/tests
            fi
          CIBW_TEST_EXTRAS: "test"
        run: |
          python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          name: wheels-linux

  build_wheels_macos:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-15
            deployment_target: "14.0"
            openmp_url: https://conda.anaconda.org/conda-forge/osx-arm64/llvm-openmp-23.1.6-hdb3d66b_0.conda
            openmp_sha256: b777843f1ced814ea99adf79ece75947ef70ed1570e7c3bf5b5633133a496b9b
          - os: macos-15-intel
            deployment_target: "15.0"
            openmp_url: https://conda.anaconda.org/conda-forge/osx-64/llvm-openmp-23.1.6-h8c1e6b9_0.conda
            openmp_sha256: d458fdf3a2ec34ba44f20c79ed9d10301d80fa7b48323d29a0fe5567305b8aee

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ">=3.12"

      - name: Install dependencies
        run: |
          packages="cmake git"
          echo "Remove preinstalled dependencies"
          for pkg in $packages libomp; do
            brew uninstall --ignore-dependencies $pkg 2>/dev/null || true
          done
          brew cleanup
          brew install $packages

      # Homebrew's libomp is built for the runner's macOS, so bundling it would raise the wheels'
      # minimum macOS. Use conda-forge's llvm-openmp (built for macOS 11) instead, as scikit-learn does.
      # Meson looks for libomp only under `brew --prefix libomp` or this fallback path.
      - name: Install libomp from conda-forge
        run: |
          python -m pip install zstandard
          curl -sSfL -o "$RUNNER_TEMP/llvm-openmp.conda" "${{ matrix.openmp_url }}"
          echo "${{ matrix.openmp_sha256 }}  $RUNNER_TEMP/llvm-openmp.conda" | shasum -a 256 -c -
          python - "$RUNNER_TEMP/llvm-openmp.conda" "$RUNNER_TEMP/llvm-openmp" <<'PY'
          import io, sys, tarfile, zipfile, zstandard
          with zipfile.ZipFile(sys.argv[1]) as z:
              name = next(n for n in z.namelist() if n.startswith("pkg-") and n.endswith(".tar.zst"))
              stream = zstandard.ZstdDecompressor().stream_reader(io.BytesIO(z.read(name)))
              with tarfile.open(fileobj=stream, mode="r|") as t:
                  t.extractall(sys.argv[2], filter="data")
          PY
          OMP_ROOT="$(brew --prefix)/opt/libomp"
          rm -rf "$OMP_ROOT"
          ln -s "$RUNNER_TEMP/llvm-openmp" "$OMP_ROOT"
          ls -l "$OMP_ROOT/include/omp.h" "$OMP_ROOT/lib/libomp.dylib"
          echo "OMP_ROOT=$OMP_ROOT" >> "$GITHUB_ENV"

      - name: Installing Python dependencies
        run: |
          pip install -U pip
          pip install cibuildwheel==3.1.4
          pip install pytest-run-parallel

      - name: Build wheels
        env:
          CIBW_BUILD: "cp312-* cp313-* cp314-* cp314t-*"
          CIBW_ENABLE: cpython-prerelease cpython-freethreading
          # CIBW_ARCHS_MACOS: ${{ matrix.os == 'macos-13' && 'x86_64' || 'arm64' }}
          CIBW_BUILD_VERBOSITY: "3"
          CIBW_ENVIRONMENT: >
            MACOSX_DEPLOYMENT_TARGET="${{ matrix.deployment_target }}"
            LDFLAGS="-Wl,-rpath,${{ env.OMP_ROOT }}/lib"
          CIBW_REPAIR_WHEEL_COMMAND: >
            delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}
          CIBW_TEST_COMMAND: |
            pip install numpy
            pip install --no-deps {wheel}
            pip install pytest pytest-run-parallel
            if python -c "import sys; exit(0 if hasattr(sys, '_is_gil_enabled') and not sys._is_gil_enabled() else 1)"; then
              pytest --parallel-threads=10 --iterations=10 {project}/tests
            else
              pytest -s {project}/tests
            fi
          CIBW_TEST_EXTRAS: "test"
        run: |
          python -m cibuildwheel --output-dir wheelhouse

      - name: Check bundled libomp
        run: |
          python - "${{ matrix.deployment_target }}" wheelhouse/*.whl <<'PY'
          import struct, sys, zipfile

          def macos_minimum(data):
              ncmds = struct.unpack_from("<I", data, 16)[0]
              offset = 32
              for _ in range(ncmds):
                  cmd, size = struct.unpack_from("<II", data, offset)
                  if cmd == 0x32:  # LC_BUILD_VERSION
                      v = struct.unpack_from("<I", data, offset + 12)[0]
                      return (v >> 16, (v >> 8) & 0xFF)
                  offset += size
              raise SystemExit("no LC_BUILD_VERSION")

          target = tuple(int(x) for x in sys.argv[1].split("."))
          tag = f"macosx_{target[0]}_{target[1]}_"
          for wheel in sys.argv[2:]:
              with zipfile.ZipFile(wheel) as z:
                  libomp = [n for n in z.namelist() if n.endswith(".dylibs/libomp.dylib")]
                  assert libomp, f"{wheel}: libomp.dylib is not bundled, so QBLAS was built without OpenMP"
                  minimum = macos_minimum(z.read(libomp[0]))
              assert minimum <= target, f"{wheel}: bundled libomp needs macOS {minimum}"
              assert tag in wheel, f"{wheel}: expected a {tag} wheel"
              print(f"{wheel}: libomp needs macOS {minimum[0]}.{minimum[1]}")
          PY

      - uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          name: wheels-${{ matrix.os }}

  # QBLAS is auto-disabled on Windows by meson.build (it uses GCC/POSIX-only
  # constructs that MSVC does not support); the wheel falls back to the
  # naive matmul kernel.
  build_wheels_windows:
    name: Build wheels on Windows
    runs-on: windows-latest
    strategy:
      matrix:
        architecture: [x64]

    steps:
      - uses: actions/checkout@v6

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.architecture }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ">=3.12"
          architecture: ${{ matrix.architecture }}

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install build dependencies
        shell: bash -l {0}
        run: |
          pip install -U pip
          pip install cibuildwheel==3.1.4 ninja meson meson-python numpy delvewheel pytest

      - name: Build wheels
        env:
          CIBW_BUILD: "cp312-* cp313-* cp314-* cp314t-*"
          CIBW_ENABLE: cpython-prerelease cpython-freethreading
          CIBW_ARCHS_WINDOWS: ${{ matrix.architecture == 'x86' && 'x86' || 'AMD64' }}
          CIBW_BUILD_VERBOSITY: "3"
          DISTUTILS_USE_SDK: "1"
          MSSdk: "1"
          CIBW_REPAIR_WHEEL_COMMAND: 'delvewheel repair -w {dest_dir} {wheel} --add-path C:\sleef\bin'
          CIBW_TEST_COMMAND_WINDOWS: pip install numpy && pip install --no-deps {wheel} && pip install pytest pytest-run-parallel && pytest -s {project}/tests
          CIBW_TEST_EXTRAS: test
        shell: pwsh
        run: |
          python -m cibuildwheel --output-dir wheelhouse
          if (-not (Test-Path wheelhouse/*.whl)) { throw "Wheel was not created" }

      - uses: actions/upload-artifact@v7
        with:
          path: ./wheelhouse/*.whl
          name: wheels-windows-${{ matrix.architecture }}

  build_sdist:
    name: Build SDist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ">=3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake gcc g++ make git pkg-config

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip build

      - name: Build SDist & test sdist
        env:
          LDFLAGS: "-fopenmp"
        run: |
          python -m build --sdist --outdir dist/
          pip install "$(ls dist/*.tar.gz)"[test] -v
          pytest -s tests

      - name: Upload SDist artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: ./dist/*.tar.gz

  publish_to_pypi:
    name: Publish to PyPI
    needs:
      [
        build_wheels_linux,
        build_wheels_macos,
        build_wheels_windows,
        build_sdist,
      ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    environment:
      name: quadtype_release
      url: https://pypi.org/p/numpy-quaddtype

    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
